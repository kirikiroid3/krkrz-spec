<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 670" width="940" height="670" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect x="0" y="0" width="940" height="670" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="470" y="32" text-anchor="middle" font-size="16" font-weight="bold">Threads and the main-thread event loop</text>

  <!-- ============ Left panel: worker threads ============ -->
  <rect x="20" y="50" width="270" height="520" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="36" y="76" font-size="16" font-weight="bold">Worker threads</text>

  <g stroke="#b42318" stroke-width="1.5" fill="#ffffff">
    <rect x="34" y="90" width="220" height="44" rx="6"/>
    <rect x="34" y="144" width="220" height="44" rx="6"/>
    <rect x="34" y="198" width="220" height="44" rx="6"/>
    <rect x="34" y="252" width="220" height="44" rx="6"/>
    <rect x="34" y="306" width="220" height="44" rx="6"/>
  </g>
  <text x="46" y="108">Timer thread</text>
  <text x="46" y="126" font-family="Menlo, Consolas, monospace" font-size="12">tTVPTimerThread</text>
  <text x="46" y="171">VSync timing thread</text>
  <text x="46" y="216">Wave buffer thread</text>
  <text x="46" y="234" font-size="12" fill="#57606a">(DirectSound fill)</text>
  <text x="46" y="279">Async image loader</text>
  <text x="46" y="324">Continuous-handler rate limiter</text>
  <text x="46" y="342" font-family="Menlo, Consolas, monospace" font-size="12" fill="#57606a">(-contfreq)</text>

  <!-- connectors to bus -->
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <line x1="254" y1="112" x2="272" y2="112"/>
    <line x1="254" y1="166" x2="272" y2="166"/>
    <line x1="254" y1="220" x2="272" y2="220"/>
    <line x1="254" y1="274" x2="272" y2="274"/>
    <line x1="254" y1="328" x2="272" y2="328"/>
    <line x1="272" y1="112" x2="272" y2="328"/>
    <line x1="272" y1="112" x2="476" y2="112" marker-end="url(#arrow)"/>
  </g>
  <!-- group label in the gap -->
  <text x="360" y="134" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">PostMessage</text>
  <text x="360" y="150" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">(WM_APP+n)</text>
  <text x="360" y="167" text-anchor="middle" font-size="12" fill="#57606a">to hidden</text>
  <text x="360" y="182" text-anchor="middle" font-size="12" fill="#57606a">queue HWND</text>

  <!-- draw thread pool -->
  <rect x="34" y="380" width="220" height="50" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <text x="46" y="400">Draw thread pool</text>
  <text x="46" y="419" font-size="12" fill="#57606a">(pixel ops only; never touches TJS)</text>

  <!-- legend -->
  <text x="36" y="474" font-size="13" font-weight="bold">Legend</text>
  <rect x="36" y="485" width="14" height="14" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="58" y="497" font-size="12">Win32 platform layer</text>
  <rect x="36" y="507" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="58" y="519" font-size="12">TJS2 script engine</text>
  <rect x="36" y="529" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="58" y="541" font-size="12">Portable engine (Intf)</text>
  <rect x="36" y="551" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="58" y="563" font-size="12">Neutral</text>

  <!-- ============ Right panel: main thread ============ -->
  <rect x="430" y="50" width="490" height="520" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="446" y="76" font-size="16" font-weight="bold">Main (GUI) thread — the only thread that runs TJS</text>

  <!-- 1. message loop -->
  <rect x="476" y="92" width="380" height="52" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="492" y="113"><tspan font-weight="bold">1</tspan>  Win32 message loop</text>
  <text x="492" y="132" font-family="Menlo, Consolas, monospace" font-size="12">PeekMessage → DispatchMessage</text>

  <line x1="666" y1="144" x2="666" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. WndProc -->
  <rect x="476" y="160" width="380" height="74" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="492" y="181"><tspan font-weight="bold">2</tspan>  <tspan font-family="Menlo, Consolas, monospace" font-size="12">WndProc</tspan></text>
  <text x="492" y="202">input <tspan font-family="Menlo, Consolas, monospace" font-size="12">WM_MOUSE*/WM_KEY*</tspan> → <tspan font-family="Menlo, Consolas, monospace" font-size="12">TVPPostInputEvent</tspan></text>
  <text x="492" y="222">queue messages → <tspan font-family="Menlo, Consolas, monospace" font-size="12">Timer.onTimer</tspan> etc. → <tspan font-family="Menlo, Consolas, monospace" font-size="12">TVPPostEvent</tspan></text>

  <line x1="666" y1="234" x2="666" y2="250" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Idle: TVPDeliverAllEvents -->
  <rect x="476" y="250" width="380" height="204" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="492" y="271"><tspan font-weight="bold">3</tspan>  Idle: <tspan font-family="Menlo, Consolas, monospace" font-size="12">TVPDeliverAllEvents</tspan></text>
  <text x="492" y="288" font-size="11" fill="#57606a">50 ms SystemWatchTimer also triggers delivery</text>
  <rect x="488" y="418" width="356" height="24" rx="4" fill="#ffffff" stroke="#1e7e34" stroke-width="1" stroke-opacity="0.5"/>
  <g fill="#1e7e34">
    <circle cx="504" cy="310" r="9"/>
    <circle cx="504" cy="334" r="9"/>
    <circle cx="504" cy="358" r="9"/>
    <circle cx="504" cy="382" r="9"/>
    <circle cx="504" cy="406" r="9"/>
    <circle cx="504" cy="430" r="9"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="504" y="314">1</text>
    <text x="504" y="338">2</text>
    <text x="504" y="362">3</text>
    <text x="504" y="386">4</text>
    <text x="504" y="410">5</text>
    <text x="504" y="434">6</text>
  </g>
  <text x="522" y="315">exclusive events</text>
  <text x="522" y="339">input events</text>
  <text x="522" y="363">normal events</text>
  <text x="522" y="387">idle-priority events</text>
  <text x="522" y="411">continuous handlers (<tspan font-family="Menlo, Consolas, monospace" font-size="12">System.addContinuousHandler</tspan>)</text>
  <text x="522" y="435">window update: layer composite → draw device</text>

  <line x1="666" y1="454" x2="666" y2="470" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. TJS handlers -->
  <rect x="476" y="470" width="380" height="40" rx="6" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="492" y="495"><tspan font-weight="bold">4</tspan>  TJS handlers run (<tspan font-family="Menlo, Consolas, monospace" font-size="12">onMouseDown</tspan>, <tspan font-family="Menlo, Consolas, monospace" font-size="12">onTimer</tspan>, …)</text>

  <!-- loop back to 1 -->
  <path d="M666,510 L666,532 L452,532 L452,132 L476,132" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="666" y="552" text-anchor="middle" font-size="12" fill="#57606a"><tspan font-family="Menlo, Consolas, monospace" fill="#1f2328">WaitMessage()</tspan> unless continuous handlers are active</text>

  <!-- phase 6 to draw device -->
  <path d="M844,430 L888,430 L888,592" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="476" y="592" width="434" height="58" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="492" y="616"><tspan font-family="Menlo, Consolas, monospace" font-size="12">LayerManager</tspan> composites in software (32bpp) →</text>
  <text x="492" y="638"><tspan font-family="Menlo, Consolas, monospace" font-size="12">tTVPBasicDrawDevice</tspan>: Direct3D 9 texture upload + Present</text>
</svg>
