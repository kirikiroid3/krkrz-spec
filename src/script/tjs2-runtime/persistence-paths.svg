<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect x="0" y="0" width="940" height="530" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Title + legend -->
  <text x="20" y="36" font-size="16" font-weight="bold">How script data is saved and read back</text>
  <g font-size="12">
    <rect x="20" y="52" width="14" height="14" rx="3" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
    <text x="40" y="64">script data / files</text>
    <rect x="170" y="52" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
    <text x="190" y="64">TJS2 runtime</text>
    <rect x="300" y="52" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
    <text x="320" y="64">portable engine (stream factories)</text>
    <rect x="540" y="52" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="560" y="64">not persisted</text>
  </g>

  <!-- Source data -->
  <rect x="20" y="200" width="190" height="96" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="115" y="222" text-anchor="middle" font-weight="bold">Dictionary / Array tree</text>
  <text x="115" y="240" text-anchor="middle" font-size="12">strings · integers · reals</text>
  <text x="115" y="256" text-anchor="middle" font-size="12">octets · void · null</text>
  <text x="115" y="282" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">saveStruct(file, mode)</text>

  <line x1="210" y1="248" x2="230" y2="248" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Mode decision -->
  <polygon points="290,203 350,248 290,293 230,248" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="290" y="244" text-anchor="middle">mode has</text>
  <text x="290" y="261" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">'b'</tspan>?</text>

  <polyline points="290,203 290,150 380,150" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="142" font-weight="bold">no</text>
  <polyline points="290,293 290,350 380,350" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="342" font-weight="bold">yes</text>

  <!-- Text path -->
  <rect x="380" y="110" width="170" height="80" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="465" y="133" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">SaveStructuredData</text>
  <text x="465" y="152" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">(const) %[ … ]</text>
  <text x="465" y="170" text-anchor="middle" font-size="12">CRLF · hex reals</text>

  <line x1="550" y1="150" x2="570" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="98" width="200" height="104" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="670" y="117" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">tTVPTextWriteStream</text>
  <g font-size="12">
    <text x="582" y="136">UTF-16LE, BOM <tspan font-family="Menlo, Consolas, monospace">FF FE</tspan></text>
    <text x="582" y="153"><tspan font-family="Menlo, Consolas, monospace">c</tspan>: <tspan font-family="Menlo, Consolas, monospace">FE FE 01</tspan> + bit swap</text>
    <text x="582" y="170"><tspan font-family="Menlo, Consolas, monospace">z</tspan>: <tspan font-family="Menlo, Consolas, monospace">FE FE 02</tspan> + zlib</text>
    <text x="582" y="187"><tspan font-family="Menlo, Consolas, monospace">oN</tspan>: start at byte N</text>
  </g>

  <line x1="770" y1="150" x2="790" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- text file icon -->
  <path d="M792,128 h22 l10,10 v30 h-32 z" fill="#fff8e1" stroke="#b08800" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M814,128 v10 h10" fill="none" stroke="#b08800" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="798" y1="146" x2="818" y2="146" stroke="#b08800" stroke-width="1"/>
  <line x1="798" y1="152" x2="818" y2="152" stroke="#b08800" stroke-width="1"/>
  <line x1="798" y1="158" x2="812" y2="158" stroke="#b08800" stroke-width="1"/>
  <text x="808" y="188" text-anchor="middle" font-size="11">text save</text>

  <!-- Binary path -->
  <rect x="380" y="310" width="170" height="80" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="465" y="333" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">tTJSBinarySerializer</text>
  <text x="465" y="352" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">"KBAD100\0" + value</text>
  <text x="465" y="370" text-anchor="middle" font-size="12">MessagePack-like, LE</text>

  <line x1="550" y1="350" x2="570" y2="350" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="310" width="200" height="80" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="670" y="333" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">TVPCreateBinaryStream</text>
  <text x="670" y="350" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">ForWrite</text>
  <text x="670" y="370" text-anchor="middle" font-size="12">honours only <tspan font-family="Menlo, Consolas, monospace">oN</tspan></text>

  <line x1="770" y1="350" x2="790" y2="350" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- binary file icon -->
  <path d="M792,328 h22 l10,10 v30 h-32 z" fill="#fff8e1" stroke="#b08800" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M814,328 v10 h10" fill="none" stroke="#b08800" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="808" y="357" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="9" fill="#b08800">01</text>
  <text x="808" y="388" text-anchor="middle" font-size="11">binary save</text>

  <!-- Read-back bus -->
  <polyline points="824,148 880,148 880,420" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <polyline points="824,348 880,348" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <line x1="880" y1="420" x2="325" y2="420" stroke="#57606a" stroke-width="1.5"/>
  <text x="870" y="412" text-anchor="end" font-size="12" fill="#57606a">read back</text>
  <line x1="325" y1="420" x2="325" y2="440" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="420" x2="560" y2="440" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="795" y1="420" x2="795" y2="440" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Readers -->
  <rect x="215" y="440" width="220" height="74" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="325" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">Scripts.evalStorage</text>
  <text x="325" y="481" text-anchor="middle" font-size="12">text: compiled and executed</text>
  <text x="325" y="499" text-anchor="middle" font-size="12">KBAD: decoded, any root</text>

  <rect x="450" y="440" width="220" height="74" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="560" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">Dictionary.loadStruct</text>
  <text x="560" y="481" text-anchor="middle" font-size="12">text: one constant, not executed</text>
  <text x="560" y="499" text-anchor="middle" font-size="12">KBAD: map root</text>

  <rect x="685" y="440" width="220" height="74" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="795" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">Array.loadStruct</text>
  <text x="795" y="481" text-anchor="middle" font-size="12">text: rejected</text>
  <text x="795" y="499" text-anchor="middle" font-size="12">KBAD: array root</text>

  <!-- Not persisted -->
  <rect x="20" y="320" width="190" height="106" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="12">
    <text x="32" y="340" font-weight="bold">never saved</text>
    <text x="32" y="356">VM stacks, running code,</text>
    <text x="32" y="372">closure code, native state</text>
    <text x="32" y="394" font-weight="bold">written as null</text>
    <text x="32" y="410">instances, functions, Date,</text>
    <text x="32" y="424" font-size="11">Layer, …, and cycles</text>
  </g>
</svg>
