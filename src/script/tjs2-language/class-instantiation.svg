<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Title + legend -->
  <text x="20" y="34" font-size="16" font-weight="bold">What <tspan font-family="Menlo, Consolas, monospace">new C(1, 2)</tspan> does for <tspan font-family="Menlo, Consolas, monospace">class C extends A, B { … }</tspan></text>
  <g font-size="12">
    <rect x="20" y="50" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
    <text x="40" y="62">engine step</text>
    <rect x="130" y="50" width="14" height="14" rx="3" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
    <text x="150" y="62">runs script code</text>
    <rect x="270" y="50" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
    <text x="290" y="62">resulting object</text>
  </g>

  <!-- Step 1 -->
  <rect x="20" y="80" width="540" height="40" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="34" y="105"><tspan font-weight="bold">1.</tspan> create an empty script object <tspan font-family="Menlo, Consolas, monospace" font-size="12">o</tspan> <tspan fill="#57606a" font-size="12">(tTJSInterCodeContext::CreateNew)</tspan></text>

  <line x1="290" y1="120" x2="290" y2="138" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 container -->
  <rect x="20" y="138" width="540" height="248" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="34" y="160"><tspan font-weight="bold">2.</tspan> run the body of class <tspan font-family="Menlo, Consolas, monospace" font-size="12">C</tspan> with <tspan font-family="Menlo, Consolas, monospace" font-size="12">this = o</tspan> <tspan fill="#57606a" font-size="12">(ExecuteAsFunction, no arguments)</tspan></text>

  <rect x="40" y="172" width="500" height="34" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="54" y="194">a. record class name <tspan font-family="Menlo, Consolas, monospace" font-size="12">"C"</tspan> on <tspan font-family="Menlo, Consolas, monospace" font-size="12">o</tspan> for <tspan font-family="Menlo, Consolas, monospace" font-size="12">instanceof</tspan> <tspan fill="#57606a" font-size="12">(VM_ADDCI)</tspan></text>

  <rect x="40" y="214" width="500" height="34" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="54" y="236">b. call the body of <tspan font-family="Menlo, Consolas, monospace" font-size="12">A</tspan> with <tspan font-family="Menlo, Consolas, monospace" font-size="12">this = o</tspan>: A's own steps a–d run recursively</text>

  <rect x="40" y="256" width="500" height="34" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="54" y="278">c. call the body of <tspan font-family="Menlo, Consolas, monospace" font-size="12">B</tspan> the same way (extends list order)</text>

  <rect x="40" y="298" width="500" height="34" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="54" y="320">d. copy C's methods, properties into <tspan font-family="Menlo, Consolas, monospace" font-size="12">o</tspan>, bound to <tspan font-family="Menlo, Consolas, monospace" font-size="12">o</tspan> <tspan fill="#57606a" font-size="12">(VM_REGMEMBER)</tspan></text>

  <rect x="40" y="340" width="500" height="34" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="54" y="362">e. remaining class-body statements (<tspan font-family="Menlo, Consolas, monospace" font-size="12">var</tspan> initializers, …)</text>

  <line x1="290" y1="386" x2="290" y2="404" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="20" y="404" width="540" height="48" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="34" y="424"><tspan font-weight="bold">3.</tspan> call the member named like the class: <tspan font-family="Menlo, Consolas, monospace" font-size="12">o.C(1, 2)</tspan></text>
  <text x="34" y="442" font-size="12" fill="#57606a">A and B constructors are NOT called automatically; the result of this call is ignored</text>

  <!-- Arrow to result -->
  <polyline points="560,428 600,428 600,300 620,300" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result object -->
  <rect x="620" y="80" width="300" height="306" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="770" y="104" text-anchor="middle" font-weight="bold">resulting value <tspan font-family="Menlo, Consolas, monospace" font-size="12">o : o</tspan></text>
  <text x="770" y="122" text-anchor="middle" font-size="12" fill="#57606a">(object, objthis) pair</text>
  <g font-size="12">
    <text x="636" y="152" font-weight="bold">members (later step wins on a clash)</text>
    <text x="648" y="172">C's own members (step d)</text>
    <text x="648" y="190">  override B's (step c)</text>
    <text x="648" y="208">  which override A's (step b)</text>
    <text x="648" y="226">every method closure is bound to o</text>
    <text x="636" y="256" font-weight="bold">class names for instanceof</text>
    <text x="648" y="276" font-family="Menlo, Consolas, monospace">"C", "A", "B"</text>
    <text x="648" y="294">(plus their own bases)</text>
    <text x="636" y="324" font-weight="bold">super</text>
    <text x="648" y="344">only with a single base class;</text>
    <text x="648" y="362">with two or more bases <tspan font-family="Menlo, Consolas, monospace">super</tspan></text>
    <text x="648" y="380">is a compile error</text>
  </g>
</svg>
