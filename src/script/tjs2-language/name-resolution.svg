<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Title + legend -->
  <text x="20" y="34" font-size="16" font-weight="bold">How a bare identifier <tspan font-family="Menlo, Consolas, monospace">x</tspan> is resolved</text>
  <g font-size="12">
    <rect x="460" y="22" width="14" height="14" rx="3" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
    <text x="480" y="34">script source</text>
    <rect x="580" y="22" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
    <text x="600" y="34">compiler / VM decision</text>
    <rect x="750" y="22" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
    <text x="770" y="34">value found</text>
    <rect x="860" y="22" width="14" height="14" rx="3" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
    <text x="880" y="34">error</text>
  </g>

  <!-- Band labels -->
  <text x="20" y="76" font-size="12" font-style="italic" fill="#57606a">compile time (tTJSInterCodeContext, case T_SYMBOL)</text>
  <line x1="20" y1="196" x2="940" y2="196" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="20" y="218" font-size="12" font-style="italic" fill="#57606a">run time (this-proxy register: objthis first, then global)</text>

  <!-- Row 1: compile time -->
  <rect x="20" y="98" width="150" height="60" rx="6" fill="#fff8e1" stroke="#b08800" stroke-width="1.5"/>
  <text x="95" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13">x</text>
  <text x="95" y="143" text-anchor="middle">used in an expression</text>

  <line x1="170" y1="128" x2="200" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="88" width="250" height="80" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="325" y="110" text-anchor="middle">declared by <tspan font-family="Menlo, Consolas, monospace" font-size="12">var</tspan>/<tspan font-family="Menlo, Consolas, monospace" font-size="12">const</tspan>, a parameter</text>
  <text x="325" y="127" text-anchor="middle">or a <tspan font-family="Menlo, Consolas, monospace" font-size="12">catch</tspan> variable in an open block</text>
  <text x="325" y="144" text-anchor="middle">of the <tspan font-weight="bold">current</tspan> function only?</text>
  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#57606a">(tTJSLocalNamespace::Find)</text>

  <line x1="450" y1="128" x2="520" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="485" y="120" text-anchor="middle" font-weight="bold">yes</text>

  <rect x="520" y="98" width="200" height="60" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
  <text x="620" y="124" text-anchor="middle">local register slot</text>
  <text x="620" y="143" text-anchor="middle" font-size="12">block-scoped, no lookup</text>

  <!-- no branch down -->
  <line x1="325" y1="168" x2="325" y2="236" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="186" font-weight="bold">no</text>

  <!-- Row 2: run time -->
  <rect x="200" y="236" width="210" height="60" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="305" y="261" text-anchor="middle">compiled as member access</text>
  <text x="305" y="280" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">(this-proxy).x</text>

  <line x1="410" y1="266" x2="440" y2="266" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="440" y="236" width="150" height="60" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="515" y="261" text-anchor="middle">member of</text>
  <text x="515" y="280" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">this</text>

  <line x1="590" y1="266" x2="630" y2="266" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="258" text-anchor="middle" font-size="11">not found</text>

  <rect x="630" y="236" width="150" height="60" rx="6" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="705" y="261" text-anchor="middle">member of</text>
  <text x="705" y="280" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">global</text>

  <line x1="780" y1="266" x2="810" y2="266" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="810" y="236" width="130" height="60" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="875" y="261" text-anchor="middle">"member not</text>
  <text x="875" y="280" text-anchor="middle">found" error</text>

  <!-- found arrows -->
  <line x1="515" y1="296" x2="515" y2="318" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="515" y="334" text-anchor="middle" font-size="12">found: read / write it</text>
  <line x1="705" y1="296" x2="705" y2="318" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="705" y="334" text-anchor="middle" font-size="12">found: read / write it</text>

  <!-- Notes -->
  <rect x="20" y="236" width="160" height="148" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <g font-size="11">
    <text x="30" y="256">Plain assignment <tspan font-family="Menlo, Consolas, monospace">x = v</tspan></text>
    <text x="30" y="271">follows the same path and</text>
    <text x="30" y="286">never creates a member.</text>
    <text x="30" y="310"><tspan font-family="Menlo, Consolas, monospace">var x</tspan> at top level or</text>
    <text x="30" y="325">directly in a class body</text>
    <text x="30" y="340">creates a member of this</text>
    <text x="30" y="355">instead of a local.</text>
    <text x="30" y="376"><tspan font-family="Menlo, Consolas, monospace">.x</tspan> uses the with() object.</text>
  </g>
  <text x="440" y="366" font-size="11" fill="#57606a">Inner functions do not see the enclosing function's locals: each function has its own namespace.</text>
</svg>
